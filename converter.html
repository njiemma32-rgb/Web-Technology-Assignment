<!DOCTYPE html>
<html>
<head>
    <title>Simple Converter</title>

    <style>
        body {
            font-family: Arial;
            margin: 0;
            padding: 20px;
            background-color: white;
        }

        h1 {
            text-align: center;
            background-color: navy;
            color: white;
            padding: 20px;
        }

        .converter {
            width: 100%;
            margin-top: 40px;
        }

        input, select, button {
            width: 100%;
            padding: 12px;
            margin: 12px 0;
            font-size: 16px;
            box-sizing: border-box;
        }

        button {
            background-color: navy;
            color: white;
            border: none;
            cursor: pointer;
        }

        #result {
            text-align: center;
            font-size: 22px;
            margin-top: 30px;
            color: green;
        }
    </style>
</head>

<body>

<h1>SIMPLE CONVERTER</h1>

<div class="converter">

    <label>Select Conversion:</label>

    <select id="category" onchange="updateUnits()">
        <option value="temperature">Temperature</option>
        <option value="distance">Distance</option>
        <option value="weight">Weight</option>
        <option value="currency">Currency</option>
    </select>

    <label>Enter Value:</label>
    <input type="number" id="amount" placeholder="Enter value">

    <label>From:</label>
    <select id="from"></select>

    <label>To:</label>
    <select id="to"></select>

    <button onclick="convert()">CONVERT</button>

    <h2 id="result">Result will appear here</h2>

</div>

<script>

function updateUnits() {
    let category = document.getElementById("category").value;

    let units = {
        temperature: ["Celsius", "Fahrenheit"],
        distance: ["Kilometres", "Metres"],
        weight: ["Kilograms", "Grams"],
        currency: ["USD", "XAF"]
    };

    from.innerHTML = "";
    to.innerHTML = "";

    units[category].forEach(unit => {
        from.add(new Option(unit, unit));
        to.add(new Option(unit, unit));
    });

    to.selectedIndex = 1;
}

function convert() {
    let value = Number(amount.value);
    let a = from.value;
    let b = to.value;
    let category = document.getElementById("category").value;
    let result;

    if (amount.value === "") {
        result = "Enter a value first";
    }
    else if (a === b) {
        result = value;
    }
    else if (category === "temperature") {
        result = a === "Celsius" ?
        value * 9/5 + 32 : (value - 32) * 5/9;
    }
    else if (category === "distance") {
        result = a === "Kilometres" ?
        value * 1000 : value / 1000;
    }
    else if (category === "weight") {
        result = a === "Kilograms" ?
        value * 1000 : value / 1000;
    }
    else {
        result = a === "USD" ?
        value * 600 : value / 600;
    }

    document.getElementById("result").innerHTML =
    "Result: " + (typeof result === "number" ?
    result.toFixed(2) + " " + b : result);
}

updateUnits();

</script>

</body>
</html>
